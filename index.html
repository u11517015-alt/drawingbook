<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兒童繪本電子書</title>
<style>
:root{
  --night:#1b1838; --night2:#2a2552; --weave:#a8231c; --gold:#f3b94d; --paper:#fbf1da; --ink:#2b1d14;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#ffffff;
  color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 12px 18px;
}
header{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:1.15rem;margin:0;letter-spacing:.08em;color:var(--weave)}
.tools{display:flex;gap:8px}
.tools button{
  background:transparent;border:2px solid var(--weave);color:var(--weave);
  border-radius:999px;padding:6px 14px;font-size:.95rem;cursor:pointer;font-family:inherit;
}
.tools button:hover,.tools button[aria-pressed="true"]{background:var(--weave);color:#fff}

/* 書頁：圖片被一圈織紋紅邊框住，像原圖的邊 */
main{width:100%;max-width:980px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.book{
  width:100%;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;
}
.arrow{background:none;border:0;padding:0;cursor:pointer;opacity:.9}
.arrow:hover{opacity:1;transform:scale(1.08)}
.arrow:disabled{opacity:.15;cursor:default;transform:none}
.arrow img{width:100%;display:block;border-radius:4px}

.page{
  background:var(--paper);border:6px solid var(--weave);border-radius:10px;
  box-shadow:0 0 0 3px var(--gold),0 10px 28px rgba(0,0,0,.18);
  overflow:hidden;
}
.page img.pic{display:block;width:100%;max-height:68vh;object-fit:contain;background:#000}
.text{
  min-height:92px;padding:16px 22px;color:var(--ink);
  font-size:clamp(1.1rem,2.6vw,1.5rem);line-height:1.8;text-align:center;
}
.page.turn{animation:turn .35s ease}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,30px))}to{opacity:1;transform:none}}

.bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:14px}
.read{
  display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--night);
  border:0;border-radius:999px;padding:4px 18px 4px 4px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;
}
.read img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.read.playing{background:var(--weave);color:var(--paper)}
.count{font-size:1rem;color:var(--ink);min-width:64px;text-align:center}
.nav{background:var(--weave);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
.nav:hover{filter:brightness(1.15)}
.nav:disabled{background:#ddd;color:#999;cursor:default;filter:none}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:720px;margin-top:12px}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:#d9d9d9;cursor:pointer}
.dots button.on{background:var(--weave);transform:scale(1.35)}

.end{padding:22px;text-align:center;color:var(--ink);background:#fff}
.end img{width:140px;mix-blend-mode:multiply}
.end button{margin-top:10px;background:var(--weave);color:var(--paper);border:0;border-radius:999px;padding:10px 22px;font-size:1.05rem;cursor:pointer;font-family:inherit}

button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-width:560px){
  .book{grid-template-columns:44px 1fr 44px;gap:4px}
  header h1{font-size:1rem}
  .page{border-width:4px}
}
@media (prefers-reduced-motion:reduce){.page.turn{animation:none}}
</style>
</head>
<body>

<header>
  <h1 id="bookTitle"></h1>
  <div class="tools">
    <button id="musicBtn" aria-pressed="false">🎵 音樂</button>
    <button id="muteBtn" aria-pressed="false">🔊 聲音開</button>
  </div>
</header>

<main>
  <div class="book">
    <button class="arrow" id="prev" aria-label="上一頁"><img src="assets/graphics/left.jpg" alt=""></button>
    <section class="page" id="page" aria-live="polite">
      <img class="pic" id="pic" src="" alt="">
    </section>
    <button class="arrow" id="next" aria-label="下一頁"><img src="assets/graphics/right.jpg" alt=""></button>
  </div>

  <div class="bar">
    <button class="nav" id="prev2">◀ 上一頁</button>
    <button class="read" id="readBtn"><img src="assets/graphics/read.jpg" alt="">朗讀</button>
    <div class="count" id="count"></div>
    <button class="nav" id="next2">下一頁 ▶</button>
  </div>
  <div class="dots" id="dots"></div>
</main>

<script>
/* ========== 你只需要改這一區 ========== */
const TOTAL_PAGES = 20;                      // 圖片張數：0.jpg ~ 19.jpg 就是 20 張
const MUSIC_FILE = "assets/music/bgm.mp3";   // 伴奏.mp3（改成你 music 資料夾裡的檔名）
const SPEECH_DIR = "assets/speech/";         // 朗讀音檔資料夾
const SPEECH_PREFIX = "speech";              // 音檔名稱開頭：speech0、speech1 ...
const SPEECH_EXTS = [".mp3", ".wav", ".m4a", ".ogg"]; // 會依序試這些副檔名
/* ====================================== */

const $ = id => document.getElementById(id);
const total = TOTAL_PAGES;
let cur = 0, voice = null, muted = false;

document.title = "繪本電子書";

// 小圓點
for (let i = 0; i < total; i++) {
  const b = document.createElement("button");
  b.setAttribute("aria-label", "第 " + i + " 頁");
  b.onclick = () => go(i);
  $("dots").appendChild(b);
}

function stopVoice(){
  if (voice){ voice.pause(); voice = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("readBtn").classList.remove("playing");
}

function go(n){
  if (n < 0 || n >= total) return;
  stopVoice();
  const dir = n >= cur ? 30 : -30;
  cur = n;
  const page = $("page");
  page.style.setProperty("--dx", dir + "px");
  page.classList.remove("turn"); void page.offsetWidth; page.classList.add("turn");

  $("pic").src = "assets/graphics/" + n + ".jpg";
  $("pic").alt = "第 " + n + " 頁插圖";
  $("count").textContent = (n + 1) + " / " + total;
  $("prev").disabled = $("prev2").disabled = n === 0;
  $("next").disabled = $("next2").disabled = n === total - 1;
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === n));

  // 最後一頁：加上小精靈和重讀按鈕
  const old = document.querySelector(".end"); if (old) old.remove();
  if (n === total - 1){
    const end = document.createElement("div");
    end.className = "end";
    end.innerHTML = '<img src="assets/graphics/spirit.png" alt="小精靈"><div>故事結束了！</div><button id="again">再看一次</button>';
    page.appendChild(end);
    $("again").onclick = () => go(0);
  }
}

// 朗讀：播放 speech 資料夾裡對應頁數的音檔
$("readBtn").onclick = () => {
  const btn = $("readBtn");
  if (btn.classList.contains("playing")) { stopVoice(); return; }
  btn.classList.add("playing");
  const page = cur;
  let k = 0;
  const tryNext = () => {
    if (page !== cur) return;
    if (k >= SPEECH_EXTS.length) { voice = null; btn.classList.remove("playing"); return; }
    voice = new Audio(SPEECH_DIR + SPEECH_PREFIX + page + SPEECH_EXTS[k++]);
    voice.muted = muted;
    voice.onended = () => { btn.classList.remove("playing"); voice = null; };
    voice.onerror = tryNext;
    voice.play().catch(() => {});
  };
  tryNext();
};

// 背景音樂
const bgm = new Audio(MUSIC_FILE); bgm.loop = true; bgm.volume = 0.4;
$("musicBtn").onclick = () => {
  const on = $("musicBtn").getAttribute("aria-pressed") !== "true";
  $("musicBtn").setAttribute("aria-pressed", on);
  on ? bgm.play().catch(() => {}) : bgm.pause();
};

// 靜音鈕：一次關掉音樂和朗讀的聲音
$("muteBtn").onclick = () => {
  muted = !muted;
  bgm.muted = muted;
  if (voice) voice.muted = muted;
  if (muted && "speechSynthesis" in window) speechSynthesis.cancel();
  $("muteBtn").setAttribute("aria-pressed", muted);
  $("muteBtn").textContent = muted ? "🔇 已靜音" : "🔊 聲音開";
};

// 翻頁：按鈕、鍵盤、滑動
$("prev").onclick = $("prev2").onclick = () => go(cur - 1);
$("next").onclick = $("next2").onclick = () => go(cur + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "ArrowRight") go(cur + 1);
});
let sx = null;
$("page").addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
$("page").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  sx = null;
}, {passive:true});

go(0);
</script>
</body>
</html>
